# cargo-deny 配置 — 7 仓库统一基线(见 base/CONFIG_BASELINE.md)
# `cargo deny check` 校验 漏洞/许可证/禁用源/重复依赖。
# 完整字段见: https://embarkstudios.github.io/cargo-deny/
# 仓库特有豁免写在 [advisories].ignore 与 [[licenses.exceptions]],须附原因注释。

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
# 按仓库填:传递依赖 RUSTSEC 豁免(每项须注释原因)

[licenses]
# 允许的宽松许可证;新增非宽松许可证需在此放行
# 注:相对统一基线,以下条目因本仓依赖树未命中而移除(零告警要求):
#     MIT-0 / ISC / Unicode-DFS-2016 / CC0-1.0 / CDLA-Permissive-2.0 / MPL-2.0 / OpenSSL
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[[bans.deny]]
name = "serde_yaml" # deprecated, use serde_yaml_ng
wrappers = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
