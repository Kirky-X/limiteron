# lefthook 配置 — 7 仓库统一基线(见 base/CONFIG_BASELINE.md)
# 启用: lefthook install(或 bash scripts/install-pre-commit.sh)
# 与 .pre-commit-config.yaml 功能等价,二选一即可。
pre-commit:
  parallel: true
  commands:
    rustfmt-check:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.rs"
      # CLIPPY_GATE 为本仓库零告警门槛 feature 组合(与 CI clippy job 一致：
      # full,postgres——full 不含驱动，postgres 腿的 adapters/dbnexus_entities
      # 必须在本地同样编译，此前本地 full 漏 postgres 与 CI 口径分裂)
      run: cargo clippy --all-targets --no-default-features --features full,postgres -- -D warnings
    cargo-deny:
      run: cargo deny check
    no-private-key:
      run: "! git diff --cached --name-only | xargs -r grep -IlE 'BEGIN (RSA|OPENSSH|PGP|EC|PRIVATE) PRIVATE KEY|sk-[A-Za-z0-9]{20,}'"

commit-msg:
  commands:
    conventional:
      run: 'grep -qE "^(feat|fix|refactor|docs|test|chore|perf|ci|build|revert|style)(\(.+\))?!?: .+" {1}'

pre-push:
  commands:
    cargo-audit:
      run: cargo audit
    coverage-80:
      name: coverage ≥80% lines
      # 与 CI coverage job 同口径（full,postgres）——此前裸 default(=[]) 统计的
      # 是零 feature 空壳，80% 门槛形同虚设。
      run: cargo llvm-cov --workspace --no-default-features --features full,postgres --lib --fail-under-lines 80
