name: Release

"on":
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify build (all features)
        run: cargo build --release --all-features --workspace

      - name: Verify tests pass
        run: cargo test --all-features --workspace --no-fail-fast

  github-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Get version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io (conditional)
    needs: github-release
    runs-on: ubuntu-latest
    env:
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      HAS_CRATES_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'

      - name: Determine token
        id: token
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'
        run: |
          if [ "${{ env.HAS_CARGO_TOKEN }}" = "true" ]; then
            echo "token=${{ secrets.CARGO_REGISTRY_TOKEN }}" >> $GITHUB_OUTPUT
          else
            echo "token=${{ secrets.CRATES_IO_TOKEN }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish limiteron-macros
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'
        run: |
          OUTPUT=$(cargo publish --token ${{ steps.token.outputs.token }} --manifest-path macros/Cargo.toml 2>&1) || {
            if echo "$OUTPUT" | grep -qE "already exists|already published"; then
              echo "::warning::limiteron-macros already published, continuing"
            else
              echo "::error::Failed to publish limiteron-macros"
              echo "$OUTPUT"
              exit 1
            fi
          }
          echo "$OUTPUT"

      - name: Wait for crates.io index update
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'
        run: sleep 30

      - name: Publish limiteron
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'
        run: |
          OUTPUT=$(cargo publish --token ${{ steps.token.outputs.token }} --all-features 2>&1) || {
            if echo "$OUTPUT" | grep -qE "already exists|already published"; then
              echo "::warning::limiteron already published, continuing"
            else
              echo "::error::Failed to publish limiteron"
              echo "$OUTPUT"
              exit 1
            fi
          }
          echo "$OUTPUT"
