[workspace]
members = [
    ".",
    "macros",
    "examples",
]
resolver = "2"
exclude = [
    "temp/comprehensive_test",
    "temp/concurrent_test",
    "temp/integration_test",
    "temp/test_macro_fixed",
    "temp/test_project",
    "temp/test_project_simple",
    "temp/comprehensive_test/Cargo.toml",
]

[workspace.package]
version = "0.3.0-rc.3"
edition = "2024"
rust-version = "1.97.1"
authors = ["Kirky.X"]
license = "MIT"
repository = "https://github.com/Kirky-X/limiteron"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
toml = "1.1"

# 时间和UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde"] }

# 错误处理
thiserror = "2.0"

# 并发和同步
parking_lot = "0.12"
futures = "0.3"

# 日志和追踪
tracing = "0.1"
log = "0.4"
scopeguard = "1.2"

# 数据结构
dashmap = "6.2"
ahash = { version = "0.8", features = ["serde"] }
regex = "1.13"
ipnet = "2.12"

# 安全
secrecy = "0.10"

# 宏相关
proc-macro2 = "1.0"
syn = { version = "3.0", features = ["full", "extra-traits"] }
quote = "1.0"

# 开发依赖
tokio-test = "0.4"
tempfile = "3.27"
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
criterion = { version = "0.8", features = ["async_tokio"] }
trybuild = "1.0"
serial_test = { version = "4.0", default-features = false }

# 数据库
sea-orm = { version = "2.0", default-features = false, features = ["macros", "with-chrono"] }

# 缓存库
oxcache = { version = "0.5.0-rc.4", default-features = false, features = ["core"] }

# 数据库抽象层 — dbnexus 0.5。注意：此处不启用 postgres/mysql/sqlite 等数据库驱动，
# 驱动由各 feature 显式请求（limiteron 的 `postgres` feature 会启用 dbnexus/postgres）。
# 若在此写死 "postgres"，会强制 server-side 驱动，与下游（如 agentstem memory 的
# dbnexus/sqlite）在同一次构建中合并，触发 dbnexus 的 embedded/server-side 互斥编译错误。
dbnexus = { version = "0.6.0-rc.3", default-features = false, features = ["macros", "sql-parser", "permission"] }

# 宏
limiteron-macros = { path = "macros", version = "0.3.0-rc.3" }

# 监控
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = { version = "0.14" }

# 工具
reqwest = { version = "0.13", features = ["json"] }
notify = { version = "8.2" }
proptest = "1.11"

# HTTP 框架
axum = { version = "0.8", features = ["json"] }
tower = { version = "0.5" }
tower-layer = { version = "0.3" }
http = { version = "1.4" }

# 安全
hmac = { version = "0.13" }
sha2 = { version = "0.11" }
hex = { version = "0.4" }

# 高级匹配
maxminddb = { version = "0.30" }
woothee = { version = "0.13" }

[package]
name = "limiteron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified flow control framework for Rust"
keywords = ["rate-limiting", "quota", "throttling", "circuit-breaker"]
categories = ["web-programming", "concurrency"]

[lints]
workspace = true

[workspace.lints.rust]

[workspace.lints.clippy]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
futures = { workspace = true, optional = true }
serde_yaml_ng.workspace = true
toml.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tracing.workspace = true
log.workspace = true

# 并发和数据结构（核心依赖）
dashmap.workspace = true
ahash.workspace = true

# 数据库操作（可选）
dbnexus = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
# 安全约束（vuln-0004 修复 / MEDIUM-003）：CVE-2025-48369，强制 rustls-webpki >= 0.103.13
# 通过 dbnexus/sea-orm/reqwest 的 TLS 依赖间接引入，显式约束最低版本以防止 Cargo 解析到脆弱版本。
# 注：版本格式为例外（用户规则要求 x.x，但安全约束需要 patch 段），安全优先级高于代码质量规则。
rustls-webpki = { version = "0.103.13", optional = true }

# 缓存库（必需）
oxcache.workspace = true

# Redis 客户端（lua-script 特性需要，用于解析 eval_lua 返回值）
redis = { version = "1.5", default-features = false, optional = true }

# 宏依赖（可选）
limiteron-macros = { workspace = true, optional = true }

# 监控依赖（可选）
tracing-subscriber = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
scopeguard = { workspace = true, optional = true }

# 工具依赖（可选）
reqwest = { workspace = true, optional = true }
notify = { workspace = true, optional = true }

# HTTP框架 - 管理API（可选）
axum = { workspace = true, optional = true }

# 安全相关（可选）
regex = { workspace = true, optional = true }
secrecy.workspace = true
ipnet.workspace = true
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

# 高级匹配（可选）
maxminddb = { workspace = true, optional = true }
woothee = { workspace = true, optional = true }

# Tower 中间件支持（可选）
tower = { workspace = true, optional = true }
tower-layer = { workspace = true, optional = true }
http = { workspace = true, optional = true }

# 国际化 (optional, feature-gated via `i18n`).
# ICU4X 2.x 提供 locale 感知的数字/日期/复数/排序格式化。
# Mirrors trait-kit/oxcache i18n pattern.
icu = { version = "2.3", optional = true }
writeable = { version = "0.6", optional = true }

# trait-kit integration (optional, feature-gated via `kit`).
# trait-kit 0.4 is used via path dependency for workspace compatibility.
[dependencies.trait-kit]
version = "0.5.0-rc.3"
features = ["async"]
optional = true
default-features = false

# inklog structured logging integration (optional, feature-gated via `inklog`).
# inklog 0.1.x is published to crates.io. `default-features = false` excludes
# the `http`/`cli` features — limiteron only needs the core LoggerManager +
# log/tracing bridge. Mirrors the trait-kit optional-dependency pattern.
[dependencies.inklog]
version = "0.3.0-rc.3"
default-features = false
optional = true

# confers configuration integration (optional, feature-gated via `config-confers`).
# Mirrors trait-kit three-tier feature pattern: confers → reload → encryption.
[dependencies.confers]
version = "0.6.0-rc.3"
default-features = false
optional = true

# 其他

[dev-dependencies]
tokio-test.workspace = true
tempfile.workspace = true
futures.workspace = true
rand.workspace = true
criterion.workspace = true
proptest.workspace = true
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
serial_test.workspace = true
# 自依赖开启 test-clock：src 内联测试经 cfg(test) 可见，tests/ 目录的
# property/chaos 用例经此 feature 编译（MockClock 门控后外部 tests 需要）
limiteron = { path = ".", default-features = false, features = ["test-clock"] }

[features]
# ============================================
# Feature Presets (预定义组合)
# ============================================

# 测试时钟 MockClock 的公开门控 feature（不入任何生产 preset；
# src 内联测试经 cfg(test) 可见，tests/ 外部用例经 self dev-dep 开启）
test-clock = []
# 配置 CLI（T612）：`limiteron-cli` 二进制 + src/cli 可单测核心。
# 默认不编译（决策热路径零开销）。
cli = []
# 封禁跨实例同步（T616）：经 oxcache Pub/Sub 总线（T301 协议层）广播封禁变更
ban-sync = ["oxcache/invalidation"]
# ============================================
# Minimal: 核心限流功能（无外部存储依赖）
minimal = []

# Standard: 标准配置 - 核心功能 + PostgreSQL
standard = ["sqlite", "ban-manager", "quota-control", "circuit-breaker"]

# Full: 所有功能
full = [
    "postgres",
    "cache-storage",
    "ban-manager",
    "quota-control",
    "circuit-breaker",
    "fallback",
    "custom-limiter",
    "gcra",
    "log-redaction",
    "config-security",
    "parallel-checker",
    "geo-matching",
    "device-matching",
    "telemetry",
    "monitoring",
    "audit-log",
    "macros",
    "config-watcher",
    "webhook",
    "cache-service",
    "tower-middleware",
    "event-system",
    "lua-script",
    "multi-tenant",
    "admin-api",
]

default = []

# Compatibility features（vecboost 兼容声明）。
# adaptive-limiting 自 rc4 起为真实实现（T610：AIMD 自适应并发限流器）。
adaptive-limiting = []
priority-queue = []
admission-control = []

# ============================================
# Storage Features (存储后端)
# ============================================
# PostgreSQL 存储 - 使用 dbnexus（显式 opt-in：默认不启用，仅在启用本 feature 时才
# 拉入 dbnexus/postgres server-side 驱动；其它 feature（如 metrics）只激活 dbnexus 非
# 驱动能力，不会与下游嵌入式数据库（sqlite/duckdb/ladybug）特性冲突）。
# 含 rustls-webpki 显式约束（MEDIUM-003：CVE-2025-48369 最低版本锁）
postgres = ["dep:dbnexus", "dbnexus/postgres", "dbnexus/runtime-tokio-rustls", "dep:sea-orm", "dep:rustls-webpki"]

# SQLite 存储 - 使用 dbnexus 嵌入式驱动（默认本地后端，无需外部服务）。
# 与 postgres 互斥（dbnexus 禁止 embedded 与 server-side 驱动共存于同一构建，
# Cargo 无 feature 互斥语法 → `--all-features` 会同时启用二者触发 dbnexus
# compile_error，多后端 crate 不适用 --all-features 验证，用两组显式 features）。
# 本地开发 / 单机部署 / 测试默认使用本 feature。
sqlite = ["dep:dbnexus", "dbnexus/sqlite", "dbnexus/runtime-tokio-rustls", "dep:sea-orm"]

# MySQL 存储 - 使用 dbnexus server-side 驱动（T607，与 postgres/sqlite 并列提供）。
# dbnexus 驱动互斥（严格）：mysql 与 postgres 互斥、与 embedded（sqlite/duckdb）
# 互斥——多后端 crate 不适用 --all-features 验证，用显式单驱动 features 组合。
mysql = ["dep:dbnexus", "dbnexus/mysql", "dbnexus/runtime-tokio-rustls", "dep:sea-orm"]

# 缓存存储 - 通过 oxcache 切换后端 (memory/redis 等)
cache-storage = ["cache-service", "oxcache/redis"]

# Lua 脚本支持 - 使用 oxcache 的 lua-script 特性
lua-script = ["oxcache/lua", "dep:redis"]

# ahash 不再作为特性，直接在依赖中定义

# ============================================
# Core Features (核心功能)
# ============================================
ban-manager = []
# 舱壁隔离（T611）：按资源组分池 + 独立并发预算/熔断/隔离指标
bulkhead = []
quota-control = []
circuit-breaker = []
fallback = []
custom-limiter = []
cache-service = []

# GCRA 限流算法
gcra = []

# ============================================
# Security Features (安全功能)
# ============================================
log-redaction = ["dep:regex"]
config-security = []
validation = []

# ============================================
# Performance Features (性能优化)
# ============================================
parallel-checker = ["ban-manager", "dep:futures"]

# ============================================
# Advanced Matching (高级匹配)
# ============================================
geo-matching = ["dep:maxminddb"]
device-matching = ["dep:woothee", "dep:regex"]

# ============================================
# Admin API (管理控制面)
# ============================================
admin-api = ["dep:axum", "dep:tower", "dep:http"]

# ============================================
# Observability Features (可观测性)
# ============================================
telemetry = [
    "dep:tracing-subscriber",
    "dep:scopeguard",
]
monitoring = ["dep:prometheus", "dep:scopeguard"]
# metrics 特性：启用 governor allow/reject/ban 三点指标记录 + dbnexus 指标传递
# 隐含 monitoring 以激活 Metrics struct 和 Prometheus 计数器
metrics = ["monitoring", "dbnexus/metrics"]
audit-log = ["telemetry", "dep:hmac", "dep:sha2", "dep:hex"]
# otlp 追踪导出（T606）：init_jaeger_tracer 升级为 OTLP/HTTP exporter
# （手工 HTTP/1.1 客户端，无新增依赖；传输可 mock，mock collector 单测覆盖）
otlp = ["telemetry"]

# ============================================
# Tooling Features (工具)
# ============================================
macros = ["dep:limiteron-macros"]
config-watcher = ["dep:notify"]
# webhook 外发（T614 起含 HMAC-SHA256 签名头 + 时间戳防重放，签名依赖与 audit-log 共享）
webhook = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:hex"]

# ============================================
# Event System (事件系统)
# ============================================
event-system = []

# ============================================
# Multi-Tenant Features (多租户)
# ============================================
multi-tenant = []

# ============================================
# Tower Middleware (HTTP 中间件)
# ============================================
tower-middleware = ["dep:tower", "dep:tower-layer", "dep:http"]

# ============================================
# Distributed Features (分布式支持)
# ============================================
# 分布式限流支持 - 提供 incr 等原子方法，兼容分布式 DAO（如 BulwarkDao）
# 进程内限流器只需 Limiter trait；分布式限流器实现 DistributedLimiter trait
distributed = []

# ============================================
# Development Features (开发/测试)
# ============================================
# 遗留测试 - 用于标记尚未实现的功能测试
legacy_tests = []

# 混沌测试特性 - 启用故障注入和延迟注入测试
chaos-testing = []

# ============================================
# External Integrations (外部集成)
# ============================================
# trait-kit 0.3 AsyncKit integration (LimiteronModule). Pulls in trait-kit
# with the `async` feature only — default features are disabled (Rule 6).
# Mirrors oxcache's `kit` feature (Phase 2 of trait-kit-async-integration).
kit = ["dep:trait-kit"]

# ICU4X 国际化能力 (locale 感知的数字/日期/复数/排序格式化).
# Mirrors trait-kit/oxcache `i18n` feature.
i18n = ["dep:icu", "dep:writeable"]

# inklog structured logging integration. Replaces bare `log`/`tracing` output
# with inklog's LoggerManager (console/file/database sinks). When disabled,
# limiteron retains its original `log`/`tracing` behavior unchanged.
inklog = ["dep:inklog"]

# confers configuration integration (three-tier pattern mirroring trait-kit).
# Base: load FlowControlConfig from confers sources (file/env).
config-confers = ["dep:confers"]
# Hot-reload: watch config files and atomically swap Governor config.
config-confers-reload = ["config-confers", "confers/watch"]

# ============================================================================
# 测试目标显式注册（阶段 2 验收）
# ============================================================================
# e2e_advanced 迁入 tests/e2e/ 目录承载（e2e_* 不得裸放顶层）；顶层文件迁入
# 子目录后脱离 Cargo 自动发现范围（仅自动发现顶层 *.rs 与 */main.rs），
# 不注册则 65 个测试静默消失。文件按 mod 域组织，仅 gcra 域有
# #[cfg(feature = "gcra")] 门控，其余用默认 feature API，无需 required-features。
[[test]]
name = "e2e_advanced"
path = "tests/e2e/e2e_advanced.rs"

# T601：K8s 探针与指标端点 e2e（/healthz /readyz /metrics，bypass 认证）。
# 需 admin-api feature；monitoring 相关断言在测试内部按 cfg 门控。
[[test]]
name = "probes_e2e"
path = "tests/e2e/probes_e2e.rs"
required-features = ["admin-api"]

# T606：OTLP 追踪导出（mock collector 单测）
[[test]]
name = "otlp_export_tests"
path = "tests/telemetry/otlp_export_tests.rs"
required-features = ["otlp"]

# T612：`limiteron-cli` 二进制（规则文件 校验/导出/apply dry-run）。
# CLI 核心逻辑在 src/cli（`cli` feature）；二进制仅参数透传。
[[bin]]
name = "limiteron-cli"
path = "src/bin/limiteron_cli.rs"
required-features = ["cli"]

[[bench]]
name = "throughput"
path = "benches/throughput.rs"
required-features = ["full"]

[[bench]]
name = "latency"
path = "benches/latency.rs"
required-features = ["full"]

[[bench]]
name = "memory"
path = "benches/memory.rs"
required-features = ["full"]

[[bench]]
name = "regression"
path = "benches/regression.rs"
required-features = ["full"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

# ============================================================================
# 本地开发联调 patch（rc.3 发布前临时指向本地路径）
# ============================================================================
[patch.crates-io]
trait-kit = { path = "../trait-kit" }
oxcache = { path = "../oxcache" }
dbnexus = { path = "../dbnexus" }
inklog = { path = "../inklog" }
confers = { path = "../confers" }
