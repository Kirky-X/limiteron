[workspace]
members = [
    ".",
    "macros",
]
resolver = "2"
exclude = [
    "temp/comprehensive_test",
    "temp/concurrent_test",
    "temp/integration_test",
    "temp/test_macro_fixed",
    "temp/test_project",
    "temp/test_project_simple",
    "temp/comprehensive_test/Cargo.toml",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
authors = ["Kirky.X"]
license = "Apache-2.0"
repository = "https://github.com/Kirky-X/limiteron"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1"

# 时间和UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde"] }

# 错误处理
thiserror = "2.0"

# 并发和同步
parking_lot = "0.12"
futures = "0.3"

# 日志和追踪
tracing = "0.1"
log = "0.4"
scopeguard = "1.2"
tracing-opentelemetry = "0.33"

# 验证和工具
validator = "0.20"

# 数据结构
dashmap = "6.2"
ahash = { version = "0.8", features = ["serde"] }
regex = "1.12"
ipnet = "2.12"

# 安全
secrecy = "0.10"

# 宏相关
proc-macro2 = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"

# 开发依赖
tokio-test = "0.4"
tempfile = "3.27"
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
criterion = { version = "0.8", features = ["async_tokio"] }
trybuild = "1.0"

# 数据库
sea-orm = { version = "2.0.0-rc.42", default-features = false, features = ["macros", "with-chrono"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls"] }

# 缓存库
oxcache = { version = "0.3", default-features = false, features = ["core"] }

# 数据库抽象层 — dbnexus 0.3 依赖 oxcache 0.2（与本项目 oxcache 0.3 冲突），暂保持 0.2
dbnexus = { version = "0.3", default-features = false, features = ["postgres", "macros", "sql-parser", "permission"] }

# 宏
limiteron-macros = { path = "macros" }

# 监控
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = { version = "0.14" }
opentelemetry = { version = "0.32" }
opentelemetry-jaeger = { version = "0.22", features = ["rt-tokio"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }

# 工具
reqwest = { version = "0.13", features = ["json"] }
notify = { version = "8.2" }
proptest = "1.11"

# HTTP 框架
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.7", features = ["cors", "auth"] }
tower = { version = "0.5" }
tower-layer = { version = "0.3" }
http = { version = "1.4" }

# 安全
hmac = { version = "0.13" }
sha2 = { version = "0.11" }
hex = { version = "0.4" }

# 高级匹配
maxminddb = { version = "0.29" }
woothee = { version = "0.13" }

[package]
name = "limiteron"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified flow control framework for Rust"
keywords = ["rate-limiting", "quota", "throttling", "circuit-breaker"]
categories = ["web-programming", "concurrency"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
futures = { workspace = true, optional = true }
serde_yaml.workspace = true
toml.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tracing.workspace = true
log.workspace = true
validator.workspace = true

# 并发和数据结构（核心依赖）
dashmap.workspace = true
ahash.workspace = true

# 数据库操作（可选）
dbnexus = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

# 缓存库（必需）
oxcache.workspace = true

# 宏依赖（可选）
proc-macro2 = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
limiteron-macros = { workspace = true, optional = true }

# 监控依赖（可选）
tracing-subscriber = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-jaeger = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
scopeguard = { workspace = true, optional = true }

# 工具依赖（可选）
reqwest = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }

# HTTP框架 - 管理API（可选）
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

# 安全相关（可选）
regex = { workspace = true, optional = true }
secrecy.workspace = true
ipnet.workspace = true
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

# 高级匹配（可选）
maxminddb = { workspace = true, optional = true }
woothee = { workspace = true, optional = true }

# Tower 中间件支持（可选）
tower = { workspace = true, optional = true }
tower-layer = { workspace = true, optional = true }
http = { workspace = true, optional = true }

# 其他

[dev-dependencies]
tokio-test.workspace = true
tempfile.workspace = true
futures.workspace = true
rand.workspace = true
criterion.workspace = true
proptest.workspace = true
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"

[features]
# ============================================
# Feature Presets (预定义组合)
# ============================================
# Minimal: 核心限流 + PostgreSQL 存储
minimal = ["postgres"]

# Standard: 标准配置 - 核心功能 + PostgreSQL
standard = ["postgres", "ban-manager", "quota-control", "circuit-breaker"]

# Full: 所有功能
full = [
    "postgres",
    "cache-storage",
    "ban-manager",
    "quota-control",
    "circuit-breaker",
    "fallback",
    "custom-limiter",
    "gcra",
    "log-redaction",
    "config-security",
    "parallel-checker",
    "geo-matching",
    "device-matching",
    "telemetry",
    "monitoring",
    "audit-log",
    "macros",
    "config-watcher",
    "webhook",
    "cache-service",
    "tower-middleware",
    "event-system",
    "lua-script",
    "multi-tenant",
    "admin-api",
]

default = []

# ============================================
# Storage Features (存储后端)
# ============================================
# PostgreSQL 存储 - 使用 dbnexus
postgres = ["dep:dbnexus", "dep:sqlx", "dep:sea-orm"]

# 缓存存储 - 通过 oxcache 切换后端 (memory/redis 等)
cache-storage = ["cache-service", "oxcache/redis"]

# Lua 脚本支持 - 使用 oxcache 的 lua-script 特性
lua-script = ["oxcache/lua-script"]

# ahash 不再作为特性，直接在依赖中定义

# ============================================
# Core Features (核心功能)
# ============================================
ban-manager = []
quota-control = []
circuit-breaker = []
fallback = []
custom-limiter = []
cache-service = []

# GCRA 限流算法
gcra = []

# ============================================
# Security Features (安全功能)
# ============================================
log-redaction = ["dep:regex"]
config-security = []
validation = []

# ============================================
# Performance Features (性能优化)
# ============================================
parallel-checker = ["ban-manager", "dep:futures"]

# ============================================
# Advanced Matching (高级匹配)
# ============================================
geo-matching = ["dep:maxminddb"]
device-matching = ["dep:woothee", "dep:regex"]

# ============================================
# Admin API (管理控制面)
# ============================================
admin-api = ["dep:axum", "dep:tower-http", "dep:tower", "dep:http"]

# ============================================
# Observability Features (可观测性)
# ============================================
telemetry = [
    "dep:tracing-subscriber",
    "dep:opentelemetry",
    "dep:opentelemetry-jaeger",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "dep:scopeguard",
]
monitoring = ["dep:prometheus"]
# metrics 特性传递给 dbnexus 以启用 record_metric 方法
metrics = ["dbnexus/metrics"]
audit-log = ["telemetry", "dep:hmac", "dep:sha2", "dep:hex"]

# ============================================
# Tooling Features (工具)
# ============================================
macros = ["dep:limiteron-macros", "dep:proc-macro2", "dep:syn", "dep:quote"]
config-watcher = ["dep:notify"]
webhook = ["dep:reqwest"]

# ============================================
# Event System (事件系统)
# ============================================
event-system = ["dep:tokio-stream"]

# ============================================
# Multi-Tenant Features (多租户)
# ============================================
multi-tenant = []

# ============================================
# Tower Middleware (HTTP 中间件)
# ============================================
tower-middleware = ["dep:tower", "dep:tower-layer", "dep:http"]

# ============================================
# Development Features (开发/测试)
# ============================================
# 遗留测试 - 用于标记尚未实现的功能测试
legacy_tests = []

# 混沌测试特性 - 启用故障注入和延迟注入测试
chaos-testing = []

[[bench]]
name = "throughput"
path = "benches/throughput.rs"
required-features = ["full"]

[[bench]]
name = "latency"
path = "benches/latency.rs"
required-features = ["full"]

[[bench]]
name = "memory"
path = "benches/memory.rs"
required-features = ["full"]

[[bench]]
name = "regression"
path = "benches/regression.rs"
required-features = ["full"]

# Coverage configuration
[package.metadata.tarpaulin]
timeout = "300"
out = ["Html", "Json"]
output-dir = "coverage"
exclude-files = [
    "**/tests/**",
    "**/examples/**",
    "**/benches/**",
    "**/src/bin/**",
    "**/macros/**",
    # 以下模块需要外部基础设施（Redis/Postgres/MaxMind DB），
    # 其覆盖率由集成测试（tests/ 目录，需 Docker）覆盖，不在单元测试覆盖率统计内。
    "**/storage/redis.rs",
    "**/adapters/dbnexus_storage.rs",
    "**/adapters/dbnexus_ban_storage.rs",
    "**/adapters/dbnexus_quota_storage.rs",
    "**/adapters/storage_factory.rs",
    "**/matchers/geo.rs",
]
fail-under = 95
