[package]
name = "limiteron-sdforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rate-limit / circuit-breaker guard layer for sdforge applications, provided from the limiteron side"
# 集成 crate 与父仓 path 双钉，不单独发布 crates.io（与 README 声明一致）
publish = false

[lints]
workspace = true

[dependencies]
limiteron = { path = "../..", version = "0.3.0-rc.8", default-features = false }
sdforge = { version = "0.5.0-rc.9", default-features = false, optional = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
tracing.workspace = true

[dev-dependencies]
limiteron = { path = "../..", default-features = false, features = [
    "standard",
    "parallel-checker",
] }
async-trait.workspace = true

[features]
# 默认仅核心 guard（协议无关，不依赖 sdforge）。
default = []
# sdforge 适配层：实现 sdforge::domain::ForgeRateLimiter
sdforge = ["dep:sdforge"]
# full preset：本 crate 全功能面 = 核心 guard + sdforge 适配层。
full = ["sdforge"]

[[example]]
name = "sdforge_guard"
required-features = ["sdforge"]
