# CI 质量门禁:fmt / clippy / check / test / cross-platform / doc / security / coverage
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --no-default-features --features full,postgres -- -D warnings
      # 脱敏引擎（inklog DataMasker）不在 full 预设内，该腿显式开启以编译并
      # 静态检查高级脱敏代码路径
      - name: Run clippy (log-redaction)
        run: cargo clippy --workspace --all-targets --no-default-features --features full,postgres,log-redaction -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check full features
        run: cargo check --workspace --no-default-features --features full,postgres
      # 脱敏引擎（inklog DataMasker）不在 full 预设内，该腿显式开启以编译
      # 高级脱敏代码路径
      - name: Check log-redaction feature
        run: cargo check --workspace --no-default-features --features full,postgres,log-redaction
      - name: Check no default features
        run: cargo check --workspace --no-default-features
      # 2026-09-19 审计补腿：sqlite/mysql 驱动闭包此前从未被编译验证
      # -p 用 path 限定：inklog rc.9 起 limiteron↔inklog 双向发布依赖使
      # lockfile 必含同名 registry 副本（cargo 断环所需），裸 -p 会歧义
      - name: Check sqlite driver
        run: cargo check -p "path+file://${{ github.workspace }}" --no-default-features --features full,sqlite
      - name: Check mysql driver
        run: cargo check -p "path+file://${{ github.workspace }}" --no-default-features --features full,mysql
      # multi-tenant 单开：命名空间封禁方法经 ban-manager 门控（to_ban_target）。
      # 该组合此前从未编译验证（Identifier 未导入 + 封禁方法/存储助手缺门控）。
      - name: Check multi-tenant alone
        run: cargo check -p "path+file://${{ github.workspace }}" --no-default-features --features multi-tenant

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run tests
        run: cargo test --workspace --no-default-features --features full,postgres

  # 脱敏腿：log-redaction 不在 full 预设内（掩码能力是对 inklog 掩码引擎的
  # 可选借用），该腿显式开启以编译并执行高级脱敏代码路径与其测试。
  # dbnexus 驱动互斥约束同 postgres 腿（一次构建只叠加一个驱动）。
  test-log-redaction:
    name: Test (log-redaction)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run tests (log-redaction)
        run: cargo test --workspace --no-default-features --features full,postgres,log-redaction

  # sqlite 测试腿：sqlite PRAGMA 透传（含 WAL 端到端）仅在 sqlite 驱动下
  # 可跑，而 dbnexus 的 sqlite/postgres 驱动互斥（compile_error!），
  # 两条腿必须各自独立 cargo 进程，不得合并到同一次调用。
  test-sqlite:
    name: Test (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run tests (sqlite)
        # limiteron-examples 的 full 预设写死 postgres（examples/Cargo.toml），
        # 与主包的 sqlite 驱动互斥，sqlite 腿须排除该成员
        run: cargo test --workspace --exclude limiteron-examples --no-default-features --features full,sqlite

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cross-${{ runner.os }}
      - name: Build (full features)
        run: cargo build --workspace --no-default-features --features full,postgres
      - name: Build (no default features)
        run: cargo build --workspace --no-default-features

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check docs consistency
        run: ./scripts/check-docs-consistency.sh
      - name: Build documentation
        run: cargo doc --workspace --no-deps --no-default-features --features full,postgres
        env:
          RUSTDOCFLAGS: -D warnings
      # docs.rs 元数据含 log-redaction，该腿与之对齐：脱敏引擎的公开 API
      # 须能生成无警告的文档
      - name: Build documentation (log-redaction)
        run: cargo doc --workspace --no-deps --no-default-features --features full,postgres,log-redaction
        env:
          RUSTDOCFLAGS: -D warnings

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install tools
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo deny
        run: cargo deny check
      - name: cargo audit
        run: cargo audit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage (gate ≥90% lines)
        run: cargo llvm-cov --workspace --no-default-features --features full,postgres --lib --fail-under-lines 90 --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          fail_ci_if_error: false
