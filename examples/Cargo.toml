[package]
name = "limiteron-examples"
version = "0.2.1"
edition = "2021"
authors = ["Kirky.X"]
description = "Limiteron usage examples - demonstrates rate limiting, circuit breaking, quota control, and ban management"
publish = false

[dependencies]
limiteron = { path = ".." }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
async-trait = "0.1"
ahash = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
futures = "0.3"
# oxcache 用于 fallback_demo 的 FallbackManager L2 缓存
oxcache = { version = "0.3", default-features = false, features = ["core"] }
# http/tower 用于 tower_middleware 的 Tower Service/Layer 集成
http = "1.4"
tower = "0.5"
# reqwest 用于 ban_http_api 示例向 AdminServer 发送 HTTP 请求
reqwest = { version = "0.13", features = ["json"] }
# tempfile 用于 ban_file_loader 示例创建临时 YAML 文件
tempfile = "3.27"
# axum 用于 ban_http_api 示例后台运行 AdminServer（axum::serve）
axum = "0.8"
# vuln-0004 修复：CVE-2025-48369，强制 rustls-webpki >= 0.103.13
# 安全优先于 x.x 版本格式规则；此为间接依赖的最低版本约束
rustls-webpki = "0.103.13"

[[bin]]
name = "simple_rate_limit"
path = "src/bin/simple_rate_limit.rs"

[[bin]]
name = "macro_usage"
path = "src/bin/macro_usage.rs"

[[bin]]
name = "rate_limiters"
path = "src/bin/rate_limiters.rs"

[[bin]]
name = "circuit_breaker"
path = "src/bin/circuit_breaker.rs"
required-features = ["circuit-breaker"]

[[bin]]
name = "quota_control"
path = "src/bin/quota_control.rs"
required-features = ["quota-control"]

[[bin]]
name = "ban_manager"
path = "src/bin/ban_manager.rs"
required-features = ["ban-manager"]

[[bin]]
name = "ban_file_loader"
path = "src/bin/ban_file_loader.rs"
required-features = ["ban-manager", "config-watcher"]

[[bin]]
name = "ban_http_api"
path = "src/bin/ban_http_api.rs"
required-features = ["ban-manager", "admin-api"]

# ============================================================================
# Part 1: 核心 API 示例（无 feature 依赖）
# ============================================================================

[[bin]]
name = "governor_demo"
path = "src/bin/governor_demo.rs"

[[bin]]
name = "matchers_demo"
path = "src/bin/matchers_demo.rs"

[[bin]]
name = "decision_chain"
path = "src/bin/decision_chain.rs"

[[bin]]
name = "custom_matchers"
path = "src/bin/custom_matchers.rs"

[[bin]]
name = "authorization_demo"
path = "src/bin/authorization_demo.rs"

[[bin]]
name = "validation_demo"
path = "src/bin/validation_demo.rs"
required-features = ["validation"]

# ============================================================================
# Part 2: Feature-gated 示例
# ============================================================================

[[bin]]
name = "storage_factory"
path = "src/bin/storage_factory.rs"
required-features = ["postgres"]

[[bin]]
name = "fallback_demo"
path = "src/bin/fallback_demo.rs"
required-features = ["fallback"]

[[bin]]
name = "audit_log_demo"
path = "src/bin/audit_log_demo.rs"
required-features = ["audit-log"]

[[bin]]
name = "tower_middleware"
path = "src/bin/tower_middleware.rs"
required-features = ["tower-middleware"]

[[bin]]
name = "telemetry_demo"
path = "src/bin/telemetry_demo.rs"
required-features = ["telemetry"]

[[bin]]
name = "device_geo_matching"
path = "src/bin/device_geo_matching.rs"
required-features = ["device-matching", "geo-matching"]

[[bin]]
name = "graceful_shutdown"
path = "src/bin/graceful_shutdown.rs"

[features]
default = []
# 核心功能
macros = ["limiteron/macros"]
circuit-breaker = ["limiteron/circuit-breaker"]
quota-control = ["limiteron/quota-control"]
ban-manager = ["limiteron/ban-manager"]
# 存储后端
postgres = ["limiteron/postgres"]
cache-service = ["limiteron/cache-service"]
# 可观测性
telemetry = ["limiteron/telemetry"]
monitoring = ["limiteron/monitoring"]
audit-log = ["limiteron/audit-log"]
# 降级与中间件
fallback = ["limiteron/fallback"]
tower-middleware = ["limiteron/tower-middleware"]
# 高级匹配
device-matching = ["limiteron/device-matching"]
geo-matching = ["limiteron/geo-matching"]
# 验证（含 ban-manager workaround：validate_ban_target 需要 ban-manager feature）
validation = ["limiteron/validation", "limiteron/ban-manager"]
# 事件系统
event-system = ["limiteron/event-system"]
# 限流算法
gcra = ["limiteron/gcra"]
# 管理 API（AdminServer）
admin-api = ["limiteron/admin-api"]
# 配置/封禁文件热重载（notify crate）
config-watcher = ["limiteron/config-watcher"]
# 完整功能（包含所有示例所需的 features）
full = [
    "macros",
    "circuit-breaker",
    "quota-control",
    "ban-manager",
    "postgres",
    "cache-service",
    "telemetry",
    "monitoring",
    "audit-log",
    "fallback",
    "tower-middleware",
    "device-matching",
    "geo-matching",
    "validation",
    "event-system",
    "gcra",
    "admin-api",
    "config-watcher",
]

[dev-dependencies]
tokio-test = "0.4"
