[workspace]
members = [
    ".",
    "macros",
]
resolver = "2"
exclude = [
    "temp/comprehensive_test",
    "temp/concurrent_test",
    "temp/integration_test",
    "temp/test_macro_fixed",
    "temp/test_project",
    "temp/test_project_simple",
    "temp/comprehensive_test/Cargo.toml",
]

[patch."https://github.com/Kirky-X/confers"]
confers-macros = { path = "/home/project/confers/macros" }

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Kirky.X"]
license = "Apache-2.0"
repository = "https://github.com/Kirky-X/limiteron"

[workspace.dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync", "io-util"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
tracing = "0.1"
futures = "0.3"

[package]
name = "limiteron"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified flow control framework for Rust"
keywords = ["rate-limiting", "quota", "throttling", "circuit-breaker"]
categories = ["web-programming", "concurrency"]

[dependencies]
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
toml = "0.8"
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tracing.workspace = true
lazy_static = "1.4"

# dashmap: 并发哈希表 (核心依赖)
dashmap = "6.0"

# 数据库操作 - 使用 dbnexus (只启用 postgres，不继承 default 特性)
dbnexus = { path = "/home/project/dbnexus", optional = true, default-features = false, features = ["postgres"] }
sqlx = { version = "0.8.5", features = ["postgres", "runtime-tokio-rustls"], optional = true }

# Redis 客户端
redis = { version = "0.24", features = ["tokio-comp", "cluster", "connection-manager"], optional = true }

# ahash: 高性能哈希算法 (核心依赖)
ahash = { version = "0.8.12", features = ["serde"] }

# 缓存库 - 使用本地 oxcache (必需依赖)
oxcache = { path = "/home/project/oxcache" }

# 配置加载 - 使用本地 confers
# 所有配置加载统一通过Confers库实现
confers = { path = "/home/project/confers", default-features = false, features = ["derive"] }
confers-macros = { path = "/home/project/confers/macros" }

# 宏依赖
proc-macro2 = { version = "1.0", optional = true }
syn = { version = "2.0", features = ["full"], optional = true }
quote = { version = "1.0", optional = true }
limiteron-macros = { path = "macros", optional = true }

# 监控依赖
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
prometheus = { version = "0.13", optional = true }
opentelemetry = { version = "0.21", optional = true }
opentelemetry-jaeger = { version = "0.20", features = ["rt-tokio"], optional = true }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"], optional = true }

# 工具依赖
reqwest = { version = "0.11", features = ["json"], optional = true }
notify = { version = "6.1", optional = true }

# 安全相关
regex = { version = "1.12", optional = true }
secrecy = "0.8"

# 高级匹配
maxminddb = { version = "0.24", optional = true }
woothee = { version = "0.13", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"

[features]
# ============================================
# Feature Presets (预定义组合)
# ============================================
# Minimal: 核心限流 + 内存存储
minimal = ["memory"]

# Standard: 标准配置 - 核心功能 + PostgreSQL
standard = ["postgres", "ban-manager", "quota-control", "circuit-breaker"]

# Full: 所有功能
full = [
    "postgres",
    "redis",
    "ban-manager",
    "quota-control",
    "circuit-breaker",
    "fallback",
    "custom-limiter",
    "log-redaction",
    "config-security",
    "parallel-checker",
    "geo-matching",
    "device-matching",
    "advanced-matchers",
    "telemetry",
    "monitoring",
    "audit-log",
    "macros",
    "config-watcher",
    "webhook",
    "code-review"
]

default = ["memory"]

# ============================================
# Storage Features (存储后端)
# ============================================
# 内存存储
memory = []
# PostgreSQL 存储 - 使用 dbnexus
postgres = ["dep:dbnexus", "dep:sqlx"]
# Redis 存储
redis = ["dep:redis"]

# ahash 不再作为特性，直接在依赖中定义

# ============================================
# Core Features (核心功能)
# ============================================
ban-manager = []
quota-control = []
circuit-breaker = []
fallback = []
custom-limiter = []

# ============================================
# Security Features (安全功能)
# ============================================
log-redaction = ["dep:regex"]
config-security = []
validation = []

# ============================================
# Performance Features (性能优化)
# ============================================
parallel-checker = ["ban-manager"]

# ============================================
# Advanced Matching (高级匹配)
# ============================================
geo-matching = ["dep:maxminddb"]
device-matching = ["dep:woothee"]
advanced-matchers = []

# ============================================
# Observability Features (可观测性)
# ============================================
telemetry = [
    "dep:tracing-subscriber",
    "dep:opentelemetry",
    "dep:opentelemetry-jaeger",
    "dep:opentelemetry_sdk",
]
monitoring = ["dep:prometheus"]
audit-log = ["telemetry"]

# ============================================
# Tooling Features (工具)
# ============================================
macros = ["dep:limiteron-macros", "dep:proc-macro2", "dep:syn", "dep:quote"]
config-watcher = ["dep:notify"]
webhook = ["dep:reqwest"]
code-review = []

[[example]]
name = "simple_rate_limit"
path = "examples/simple_rate_limit.rs"
required-features = ["macros"]

[[example]]
name = "macro_usage"
path = "examples/macro_usage.rs"
required-features = ["macros"]

[[bench]]
name = "throughput"
path = "benches/throughput.rs"
required-features = ["full"]

[[bench]]
name = "latency"
path = "benches/latency.rs"
required-features = ["full"]
