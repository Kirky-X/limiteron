[workspace]
members = [
    ".",
    "macros",
]
resolver = "2"
exclude = [
    "temp/comprehensive_test",
    "temp/concurrent_test",
    "temp/integration_test",
    "temp/test_macro_fixed",
    "temp/test_project",
    "temp/test_project_simple",
    "temp/comprehensive_test/Cargo.toml",
]

[patch."https://github.com/Kirky-X/confers"]
confers = { path = "/home/dev/projects/confers" }

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Kirky.X"]
license = "Apache-2.0"
repository = "https://github.com/Kirky-X/limiteron"

[workspace.dependencies]
# 异步运行时
tokio = { version = "~1.50", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync", "io-util"] }
tokio-util = { version = "~0.7", features = ["rt"] }
tokio-stream = { version = "~0.1", features = ["sync"] }
async-trait = "~0.1"

# 序列化
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
serde_yaml = "~0.9"
toml = "~1.1"

# 时间和UUID
chrono = { version = "~0.4", features = ["serde"] }
uuid = { version = "~1.22", features = ["v4", "serde"] }

# 错误处理
anyhow = "~1.0"
thiserror = "~2.0"

# 并发和同步
parking_lot = "~0.12"
futures = "~0.3"

# 日志和追踪
tracing = "~0.1"
log = "~0.4"
scopeguard = "~1.2"
tracing-opentelemetry = "~0.32"

# 验证和工具
validator = "~0.20"
lazy_static = "~1.5"

# 数据结构
dashmap = "~6.1"
ahash = { version = "~0.8", features = ["serde"] }
regex = "~1.12"
ipnet = "~2.10"

# 安全
secrecy = "~0.10"

# 宏相关
proc-macro2 = "~1.0"
syn = { version = "~2.0", features = ["full", "extra-traits"] }
quote = "~1.0"
darling = "~0.23"

# 开发依赖
tokio-test = "~0.4"
tempfile = "~3.27"
rand = { version = "~0.10", default-features = false, features = ["std_rng"] }
criterion = { version = "~0.5", features = ["async_tokio"] }
trybuild = "~1.0"

[package]
name = "limiteron"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified flow control framework for Rust"
keywords = ["rate-limiting", "quota", "throttling", "circuit-breaker"]
categories = ["web-programming", "concurrency"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
futures = { workspace = true, optional = true }
serde_yaml.workspace = true
toml.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
tracing.workspace = true
log.workspace = true
lazy_static.workspace = true
validator.workspace = true

# 并发和数据结构（核心依赖）
dashmap.workspace = true
ahash.workspace = true

# 数据库操作 - 使用本地 dbnexus (启用 macros 特性以支持 Entity 定义)
# 注意：dbnexus 默认启用 sqlite，与 postgres 特性互斥，需要禁用 sqlite
dbnexus = { path = "/home/dev/projects/dbnexus", optional = true, default-features = false, features = ["postgres", "macros", "sql-parser"] }
sea-orm = { version = "2.0.0-rc.37", optional = true, default-features = false, features = ["macros", "with-chrono"] }
sqlx = { version = "~0.8", features = ["postgres", "runtime-tokio-rustls"], optional = true }

# 缓存库 - 使用本地 oxcache (必需依赖)
oxcache = { path = "/home/dev/projects/oxcache", features = ["wal-recovery"] }

# 配置加载 - 使用本地 confers (可选特性)
confers = { path = "/home/dev/projects/confers", optional = true, default-features = false }

# 宏依赖（可选）
proc-macro2 = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
limiteron-macros = { path = "macros", optional = true }

# 监控依赖（可选）
tracing-subscriber = { version = "~0.3", features = ["env-filter"], optional = true }
prometheus = { version = "~0.14", optional = true }
opentelemetry = { version = "~0.31", optional = true }
opentelemetry-jaeger = { version = "~0.22", features = ["rt-tokio"], optional = true }
opentelemetry_sdk = { version = "~0.31", features = ["rt-tokio"], optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
scopeguard = { workspace = true, optional = true }

# 工具依赖（可选）
reqwest = { version = "~0.13", features = ["json"], optional = true }
notify = { version = "~8.2", optional = true }
tokio-stream = { workspace = true, optional = true }

# 安全相关（可选和必需）
regex = { workspace = true, optional = true }
secrecy.workspace = true
ipnet.workspace = true
hmac = { version = "~0.12", optional = true }
sha2 = { version = "~0.10", optional = true }
hex = { version = "~0.4", optional = true }

# 高级匹配（可选）
maxminddb = { version = "~0.27", optional = true }
woothee = { version = "~0.13", optional = true }

# Redis 客户端（可选）- 使用 0.27 版本与 oxcache 保持一致
redis = { version = "=0.27.6", default-features = false, features = ["tokio-comp"] }

# Tower 中间件支持（可选）
tower = { version = "~0.5", optional = true }
tower-layer = { version = "~0.3", optional = true }
http = { version = "~1.4", optional = true }
crc32fast = "1.4"

[dev-dependencies]
tokio-test.workspace = true
tempfile.workspace = true
futures.workspace = true
rand.workspace = true
criterion.workspace = true

[features]
# ============================================
# Feature Presets (预定义组合)
# ============================================
# Minimal: 核心限流 + PostgreSQL 存储
minimal = ["postgres"]

# Standard: 标准配置 - 核心功能 + PostgreSQL
standard = ["postgres", "ban-manager", "quota-control", "circuit-breaker"]

# Full: 所有功能
full = [
    "postgres",
    "redis-storage",
    "ban-manager",
    "quota-control",
    "circuit-breaker",
    "fallback",
    "custom-limiter",
    "gcra",
    "log-redaction",
    "config-security",
    "parallel-checker",
    "geo-matching",
    "device-matching",
    "advanced-matchers",
    "telemetry",
    "monitoring",
    "audit-log",
    "macros",
    "config-watcher",
    "webhook",
    "code-review",
    "cache-service",
    "confers",
    "tower-middleware",
]

default = ["postgres", "confers"]

# ============================================
# Storage Features (存储后端)
# ============================================
# PostgreSQL 存储 - 使用 dbnexus
postgres = ["dep:dbnexus", "dep:sqlx", "dep:sea-orm"]

# Redis 存储 - 分布式一致性存储
redis-storage = []

# Lua 脚本支持 - 使用 oxcache 的 lua-script 特性
# 需要 redis 特性来提供 Redis 后端
lua-script = ["oxcache/lua-script"]

# ahash 不再作为特性，直接在依赖中定义

# ============================================
# Core Features (核心功能)
# ============================================
ban-manager = []
quota-control = []
circuit-breaker = []
fallback = []
custom-limiter = []
cache-service = []
confers = ["dep:confers"]

# GCRA 限流算法
gcra = []

# ============================================
# Security Features (安全功能)
# ============================================
log-redaction = ["dep:regex"]
config-security = []
validation = []

# ============================================
# Performance Features (性能优化)
# ============================================
parallel-checker = ["ban-manager", "dep:futures"]

# ============================================
# Advanced Matching (高级匹配)
# ============================================
geo-matching = ["dep:maxminddb"]
device-matching = ["dep:woothee", "dep:regex"]
advanced-matchers = []

# ============================================
# Observability Features (可观测性)
# ============================================
telemetry = [
    "dep:tracing-subscriber",
    "dep:opentelemetry",
    "dep:opentelemetry-jaeger",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "dep:scopeguard",
]
monitoring = ["dep:prometheus"]
# metrics 特性传递给 dbnexus 以启用 record_metric 方法
metrics = ["dbnexus/metrics"]
audit-log = ["telemetry", "dep:hmac", "dep:sha2", "dep:hex"]

# ============================================
# Tooling Features (工具)
# ============================================
macros = ["dep:limiteron-macros", "dep:proc-macro2", "dep:syn", "dep:quote"]
config-watcher = ["dep:notify"]
webhook = ["dep:reqwest"]
code-review = []

# ============================================
# Event System (事件系统)
# ============================================
event-system = ["dep:tokio-stream"]

# ============================================
# Multi-Tenant Features (多租户)
# ============================================
multi-tenant = []

# ============================================
# Tower Middleware (HTTP 中间件)
# ============================================
tower-middleware = ["dep:tower", "dep:tower-layer", "dep:http"]

# ============================================
# Development Features (开发/测试)
# ============================================
# 遗留测试 - 用于标记尚未实现的功能测试
legacy_tests = []

[[bench]]
name = "throughput"
path = "benches/throughput.rs"
required-features = ["full"]

[[bench]]
name = "latency"
path = "benches/latency.rs"
required-features = ["full"]

[[bench]]
name = "memory"
path = "benches/memory.rs"
required-features = ["full"]

[[bench]]
name = "regression"
path = "benches/regression.rs"
required-features = ["full"]

# Coverage configuration
[package.metadata.tarpaulin]
timeout = "300"
out = ["Html", "Json"]
output-dir = "coverage"
exclude-files = [
    "tests/*",
    "examples/*",
    "benches/*",
    "src/bin/*",
]
fail-under = 80
