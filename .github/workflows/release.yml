name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Verify build (all features)
        run: cargo build --release --workspace --no-default-features --features full
      - name: Verify tests pass
        run: cargo test --workspace --no-fail-fast --no-default-features --features full

  github-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io (conditional)
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      HAS_CRATES_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'

      # 凭据经 env 间接引用（安全加固：secrets 不直接插入 run: 脚本、
      # 不写入 GITHUB_OUTPUT，缩小泄漏面）
      - name: Publish limiteron-macros
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            TOKEN="$CARGO_REGISTRY_TOKEN"
          else
            TOKEN="$CRATES_IO_TOKEN"
          fi
          OUTPUT=$(cargo publish --token "$TOKEN" --manifest-path macros/Cargo.toml 2>&1) || {
            if echo "$OUTPUT" | grep -qE "already exists|already published"; then
              echo "::warning::limiteron-macros already published, continuing"
            else
              echo "::error::Failed to publish limiteron-macros"
              echo "$OUTPUT"
              exit 1
            fi
          }
          echo "$OUTPUT"

      - name: Wait for crates.io index update
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'
        run: sleep 30

      - name: Publish limiteron
        if: env.HAS_CARGO_TOKEN == 'true' || env.HAS_CRATES_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            TOKEN="$CARGO_REGISTRY_TOKEN"
          else
            TOKEN="$CRATES_IO_TOKEN"
          fi
          OUTPUT=$(cargo publish --token "$TOKEN" --no-default-features --features full 2>&1) || {
            if echo "$OUTPUT" | grep -qE "already exists|already published"; then
              echo "::warning::limiteron already published, continuing"
            else
              echo "::error::Failed to publish limiteron"
              echo "$OUTPUT"
              exit 1
            fi
          }
          echo "$OUTPUT"
