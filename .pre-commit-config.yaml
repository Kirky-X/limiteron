# pre-commit 配置 — 7 仓库统一基线(见 base/CONFIG_BASELINE.md)
# 安装: pip install pre-commit && pre-commit install --install-hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      # no-commit-to-branch 已移除：本项目工作流为 main 直提(无 PR 流程，
      # 与 475c173/1f532a4 既定决策一致)，该护栏与工作流冲突。

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--exclude-files, tests/, --exclude-files, examples/]
        exclude: '^Cargo\.lock$'

  - repo: https://github.com/crate-ci/typos
    rev: v1.28.0
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: cargo-fmt
        name: Format Rust code
        description: Run rustfmt on Rust files
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        entry: cargo check --no-default-features --features full
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --no-default-features --features full -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
